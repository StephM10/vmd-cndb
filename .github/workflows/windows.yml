name: Windows build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/deps
            build/sources
          key: windows-static-v1-${{ hashFiles('scripts/build.ps1') }}
      - name: Build native plugin and package
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - name: Reader and installer tests
        shell: pwsh
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/test_reader.py --exe build/plugin/Release/cndb_check.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_installer.py --package dist/vmd-cndb-0.2.1-windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: vmd-cndb-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
